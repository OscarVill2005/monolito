services:

  backend:
    build: ./backend
    container_name: backend
    networks:
      - reddoscapas
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=monolito
      - DB_USER=postgres
      - DB_PASSWORD=Rumbo2005
    ports:
      - "1234:3000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Rumbo2005
      - POSTGRES_DB=monolito
    networks:
      - reddoscapas
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    


networks:
  reddoscapas:
    driver: bridge

volumes:
  datos_postgres:
    driver: local